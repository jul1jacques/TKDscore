<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/png" href="/escudo.png">

<meta charset="UTF-8" />
<title>Supervisor - TKDscore</title>

<style>
    .headerSupervisor {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-bottom: 25px;
}

.logoSupervisor {
    height: 90px;
    width: auto;
}

    body {
        background: #f0f0f0;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
    }

    h1 {
        text-align: center;
        margin-bottom: 20px;
        font-size: 36px;
    }

    #contenedorMesas {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
    }

    .mesaCard {
        width: 260px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 0 10px #0003;
        padding: 15px;
        text-align: center;
    }

    .mesaTitulo {
        font-size: 24px;
        margin-bottom: 10px;
        font-weight: bold;
    }

    .puntaje {
        display: flex;
        justify-content: space-between;
        font-size: 22px;
        margin-top: 10px;
    }

    .rojo { color: #e33; font-weight: bold; }
    .azul { color: #06f; font-weight: bold; }

    .faltas {
        font-size: 18px;
        margin-top: 8px;
    }

    .timer {
        font-size: 26px;
        margin-top: 10px;
        font-weight: bold;
    }

    .ganandoRojo {
        border-left: 8px solid #e33;
    }
    .ganandoAzul {
        border-left: 8px solid #06f;
    }
    .empate {
        border-left: 8px solid #999;
    }

    .jueces {
        font-size: 16px;
        margin-top: 8px;
        color: #555;
    }

    .mesaCard {
    padding: 15px;
    margin: 10px;
    border-radius: 10px;
    background: #f2f2f2;
}

.mesaCard strong {
    font-size: 16px;
}

.mesaCard p:nth-child(2) strong {
    color: #e33; /* default combate */
}
</style>
</head>

<body>

<div class="headerSupervisor">
    <img src="escudo.png" class="logoSupervisor">
</div>
    <h1>Supervisor de Mesas</h1>

<div id="contenedorMesas"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="supervisor.js"></script>

</body>
</html>
